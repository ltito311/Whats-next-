<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>What's Next</title>
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="What's Next" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <main class="board">
      <header class="board-header">
        <h1>What's Next</h1>
        <form id="quick-add" autocomplete="off">
          <input id="quick-add-input" type="text" placeholder="Quick add a task…" />
          <button type="submit">Add</button>
        </form>
        <button id="focus-banner" class="focus-banner" hidden></button>
      </header>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state" hidden>
        Nothing here yet. Add a task above — or just tell the assistant what you need to do.
      </p>
    </main>

    <aside class="chat">
      <header class="chat-header">
        <h2>Assistant</h2>
        <div class="mode-toggle" role="tablist">
          <button id="mode-tasks" class="mode-btn active" title="Do-what-I-said mode: fast task execution">⚡ Tasks</button>
          <button id="mode-brainstorm" class="mode-btn" title="Thinking-partner mode: ramble, plan your day, untangle your workflow">💭 Brainstorm</button>
        </div>
        <div class="header-actions">
          <span id="model-badge" class="model-badge">…</span>
          <button id="clear-chat-btn" class="tiny-btn" title="Clear conversation">🗑</button>
        </div>
      </header>
      <div id="chat-log" class="chat-log"></div>
      <div id="chat-error" class="chat-error" hidden></div>
      <footer class="chat-input">
        <button id="plan-btn" class="icon-btn" title="Morning kickoff — plan my day from the board and my priorities">☀️</button>
        <button id="mic-btn" class="icon-btn" title="Hold a voice note — I'll transcribe it live">🎤</button>
        <textarea id="chat-text" rows="1" placeholder="Message the assistant…"></textarea>
        <button id="send-btn" class="icon-btn send" title="Send">✔</button>
      </footer>
      <p id="mic-status" class="mic-status" hidden>Listening… speak freely, then hit ✔ to send.</p>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
