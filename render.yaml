# One-click deploy blueprint for Render (render.com).
# New + -> Blueprint -> pick this repo, then set PROVIDER_API_KEY when asked.
services:
  - type: web
    name: whats-next
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: PROVIDER
        value: deepseek
      - key: PROVIDER_API_KEY
        sync: false
