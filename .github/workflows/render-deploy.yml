name: Deploy to Render

# Push-to-deploy with bootstrap: on every push, create the Render service if
# it doesn't exist yet (using the RENDER_API_KEY repo secret), sync env vars,
# deploy, and wait until live. No-ops politely while the secret is missing.

on:
  push:
    branches:
      - main
      - claude/multimodal-task-agent-1q2u8l
  workflow_dispatch:

concurrency: render-deploy

env:
  SERVICE_NAME: whats-next
  REPO_URL: https://github.com/${{ github.repository }}
  RENDER_API: https://api.render.com/v1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create service if needed, then deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          # Fallbacks: user-named secrets; sorted by value prefix below.
          ALT1: ${{ secrets.YOLO }}
          ALT2: ${{ secrets.YESE }}
          ALT3: ${{ secrets.YES }}
        run: |
          set -euo pipefail
          # A Render API key always starts with rnd_ — find it whatever the
          # secret is named. Any other non-empty candidate is treated as the
          # model provider key (DeepSeek keys start with sk-).
          for v in "$ALT1" "$ALT2" "$ALT3"; do
            [ -z "$v" ] && continue
            case "$v" in
              rnd_*) RENDER_API_KEY="$v" ;;
              *) [ -z "$PROVIDER_API_KEY" ] && PROVIDER_API_KEY="$v" ;;
            esac
          done
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY secret not set yet — skipping. Add it at $REPO_URL/settings/secrets/actions (name: RENDER_API_KEY)."
            exit 0
          fi
          auth=(-H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json")

          # App env vars (PROVIDER_API_KEY secret enables the AI chat).
          ENVVARS='[{"key":"PROVIDER","value":"deepseek"}'
          if [ -n "$PROVIDER_API_KEY" ]; then
            ENVVARS+=',{"key":"PROVIDER_API_KEY","value":"'"$PROVIDER_API_KEY"'"}'
          fi
          ENVVARS+=']'

          SID=$(curl -sf "${auth[@]}" "$RENDER_API/services?name=$SERVICE_NAME&type=web_service&limit=1" | jq -r '.[0].service.id // empty')

          if [ -z "$SID" ]; then
            echo "No existing service — creating '$SERVICE_NAME' from $REPO_URL@$GITHUB_REF_NAME"
            OWNER=$(curl -sf "${auth[@]}" "$RENDER_API/owners?limit=1" | jq -r '.[0].owner.id')
            CREATE=$(jq -n \
              --arg owner "$OWNER" --arg repo "$REPO_URL" --arg branch "$GITHUB_REF_NAME" \
              --arg name "$SERVICE_NAME" --argjson envVars "$ENVVARS" \
              '{type:"web_service", name:$name, ownerId:$owner, repo:$repo, branch:$branch,
                autoDeploy:"no", envVars:$envVars,
                serviceDetails:{runtime:"node", plan:"free", region:"oregon",
                  envSpecificDetails:{buildCommand:"", startCommand:"node server.js"}}}')
            RESP=$(curl -s "${auth[@]}" -X POST "$RENDER_API/services" -d "$CREATE")
            SID=$(echo "$RESP" | jq -r '.service.id // empty')
            if [ -z "$SID" ]; then
              echo "::error::Service creation failed: $(echo "$RESP" | jq -c '.message // .' | head -c 400)"
              exit 1
            fi
            URL=$(echo "$RESP" | jq -r '.service.serviceDetails.url')
          else
            BRANCH=$(curl -sf "${auth[@]}" "$RENDER_API/services/$SID" | jq -r '.branch')
            if [ "$BRANCH" != "$GITHUB_REF_NAME" ]; then
              echo "Service tracks '$BRANCH', this push is '$GITHUB_REF_NAME' — skipping."
              exit 0
            fi
            echo "Service exists ($SID) — syncing env vars and redeploying"
            curl -sf "${auth[@]}" -X PUT "$RENDER_API/services/$SID/env-vars" -d "$ENVVARS" > /dev/null
            URL=$(curl -sf "${auth[@]}" "$RENDER_API/services/$SID" | jq -r '.serviceDetails.url')
            curl -sf "${auth[@]}" -X POST "$RENDER_API/services/$SID/deploys" -d '{}' > /dev/null
          fi

          echo "SERVICE URL: $URL"
          {
            echo "### 🚀 What's Next"
            echo "**URL:** $URL"
          } >> "$GITHUB_STEP_SUMMARY"

          # Wait for the deploy to go live.
          for i in $(seq 1 40); do
            sleep 15
            STATUS=$(curl -sf "${auth[@]}" "$RENDER_API/services/$SID/deploys?limit=1" | jq -r '.[0].deploy.status')
            echo "deploy status: $STATUS"
            case "$STATUS" in
              live) echo "DEPLOY LIVE: $URL"; exit 0 ;;
              build_failed|update_failed|deactivated|canceled)
                echo "::error::Deploy ended with status: $STATUS"; exit 1 ;;
            esac
          done
          echo "::warning::Timed out waiting; check the Render dashboard."
